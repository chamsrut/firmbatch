name: ci

# firmbatch is imported as a PACKAGE: tests/test_recovery.py does
# `from firmbatch.control import db` and the v1 foundation suite does
# `from firmbatch.control_plane import config`. The repository must therefore be checked
# out into a directory named `firmbatch` and the tests run from its PARENT. A default
# checkout into the workspace root breaks the import. This is the single most fragile
# thing in this file -- do not "simplify" the checkout path.
#
# Everything else is delegated to scripts/verify-repository.sh, which is the same script
# humans and agents run, invoked exactly once. Do not re-spell its gates here: a gate
# that exists in only one of the three places is a gate that silently stops being true.

on:
  push:
    branches: ["**"]
  pull_request:
  # Milestone 3.3b: artifact-publish.yml reuses this workflow, unchanged, as the full required
  # verification its publication depends on. Called that way it still holds no environment, OIDC
  # token, secret or AWS credential.
  workflow_call:

permissions:
  contents: read

jobs:
  # --------------------------------------------------------------------------------
  # Both dependency locks, each installed into its OWN clean virtual environment.
  #
  # Installing only the development lock cannot prove the runtime lock is usable: the
  # development lock is a superset, so a stale runtime pin, an incompatible resolution or
  # a wrong hash in requirements-v1-lock.txt would be masked by whatever the development
  # lock happens to install first. Separate environments are the only way the runtime lock
  # gets tested as the thing a production install would actually use.
  #
  # --require-hashes on both, so a re-uploaded or substituted distribution fails the job
  # rather than running in it.
  locks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out into a directory named firmbatch
        uses: actions/checkout@v4
        with:
          path: firmbatch

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Runtime lock installs cleanly
        working-directory: firmbatch
        run: |
          python -m venv /tmp/runtime-env
          /tmp/runtime-env/bin/python -m pip install --require-hashes -r requirements-v1-lock.txt
          /tmp/runtime-env/bin/python -c "import sqlalchemy, alembic, psycopg; print(sqlalchemy.__version__, alembic.__version__, psycopg.__version__)"

      # Installing third-party packages proves the LOCK resolves. It says nothing about
      # whether Firmbatch runs on it. A production module that grew an import satisfied
      # only by the development lock -- pytest, ruff, or anything they drag in -- would
      # install here, import cleanly in the `verify` job (which has the development lock),
      # and fail on first use in production.
      #
      # So: import every production module on an interpreter that has ONLY the runtime
      # lock, run a real production entry point, and assert every third-party module was
      # served out of THIS environment rather than leaking in from the development one.
      # Deliberately no PYTHONPATH beyond the checkout parent -- the script adds it -- so
      # nothing else can satisfy an import.
      #
      # The same script runs from verify-repository.sh with --static, which is the half
      # that works without a virtual environment. This is the half that catches deferred
      # and conditional imports, which no parser can see.
      - name: Production code runs on the runtime lock alone
        working-directory: firmbatch
        run: /tmp/runtime-env/bin/python scripts/check-runtime-imports.py --dynamic

      - name: Development lock installs cleanly in a separate environment
        working-directory: firmbatch
        run: |
          python -m venv /tmp/dev-env
          /tmp/dev-env/bin/python -m pip install --require-hashes -r requirements-v1-dev-lock.txt
          /tmp/dev-env/bin/python -c "import sqlalchemy, alembic, psycopg, pytest; print('dev lock ok')"

      - name: The two locks agree on every shared pin
        working-directory: firmbatch
        run: |
          python - <<'PY'
          import re, pathlib
          def pins(path):
              out = {}
              for line in pathlib.Path(path).read_text().splitlines():
                  m = re.match(r"^([A-Za-z0-9_.\-]+)==([^\s\\]+)", line)
                  if m:
                      out[m.group(1).lower().replace("_", "-")] = m.group(2)
              return out
          runtime, dev = pins("requirements-v1-lock.txt"), pins("requirements-v1-dev-lock.txt")
          assert runtime, "runtime lock has no pins"
          drift = {k: (v, dev.get(k)) for k, v in runtime.items() if dev.get(k) != v}
          assert not drift, f"the locks disagree on shared pins: {drift}"
          print(f"{len(runtime)} runtime pins, {len(dev)} development pins, no drift")
          PY

  verify:
    runs-on: ubuntu-latest
    needs: locks

    # The Milestone 2.1 foundation suite tests PostgreSQL semantics -- row-level
    # security, forced policies, role attributes, transaction-local settings -- so it
    # runs against a real server. 16 to match the local development environment and the
    # RDS version named in the target architecture; the suite refuses any other major
    # version rather than reporting a green that says nothing about the target.
    #
    # The suite creates and drops its own disposable database and roles inside this
    # container; nothing here persists beyond the job.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres   # test-only credential for an ephemeral container
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # A maintenance connection to the ephemeral service container. Every identity and
      # endpoint field is explicit -- user, password, host, port, database -- because an
      # omitted field would be supplied by PGUSER/PGHOST/PGPORT rather than by this file,
      # and the configuration boundary refuses URLs that leave anything to infer.
      FIRMBATCH_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/postgres
      # Milestone 3.3b. This job holds no AWS credential and no GitHub environment; the
      # Terraform gate also disables instance metadata itself. Stated here as well so no step
      # in this job can fall back to a runner's metadata credentials.
      AWS_EC2_METADATA_DISABLED: "true"

    steps:
      - name: Check out into a directory named firmbatch
        uses: actions/checkout@v4
        with:
          path: firmbatch

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Node 24 LTS, matching what portal/package.json requires through `engines` and
      # `engine-strict`. Pinned to a major rather than floating, so the portal gate runs on
      # the same runtime here and on a developer's machine (Milestone 3.2).
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      # Terraform for the Terraform and delivery foundation gate (Milestone 3.3b): fmt,
      # backend-disabled init with a read-only lock file, validate, tests against mocked AWS
      # providers, and the repository's policy checks. Pinned to the version in
      # infra/terraform/.terraform-version -- the gate fails on any other -- and SHA-pinned,
      # as a third-party action. The wrapper is off so the gate sees Terraform's own output and
      # exit codes. The verify script's gate FAILS rather than skips if this step is removed.
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      # The development lock, which includes the runtime closure. The `locks` job above has
      # already proven the runtime lock stands on its own; this job needs pytest too.
      - name: Install pinned v1 test dependencies
        working-directory: firmbatch
        run: python -m pip install --require-hashes -r requirements-v1-dev-lock.txt

      # `npm ci` rather than `npm install`: it installs exactly the tracked
      # package-lock.json and fails if the lock and the manifest disagree, which is the same
      # property --require-hashes gives the Python locks above. The verify script's portal
      # gate FAILS rather than skips if this step is removed, so the gate cannot quietly
      # stop running.
      - name: Install pinned portal dependencies
        working-directory: firmbatch/portal
        run: npm ci

      # The test helpers refuse to create or drop anything on a server that is not
      # explicitly attested as disposable -- every PostgreSQL cluster has a `postgres`
      # database, so the URL alone proves nothing. This container is created and destroyed
      # by this job, which is exactly what the marker is for. This does not weaken the
      # check: it satisfies it, in the open, for a server that genuinely is throwaway.
      - name: Attest the ephemeral service container as a disposable test cluster
        working-directory: ${{ github.workspace }}
        env:
          FIRMBATCH_ENV: test
        run: python -m firmbatch.control_plane.testing.attestation --mark

      # Invoked through `bash` rather than as ./scripts/... so a lost executable bit on
      # checkout is not the thing that breaks CI.
      - name: Verify repository
        working-directory: firmbatch
        run: bash ./scripts/verify-repository.sh

  # --------------------------------------------------------------------------------
  # The production container image (Milestone 3.3b), built from the pinned base-image digests
  # and the committed Python and Node locks.
  #
  # A build check, not a delivery: it logs in to no registry, pushes nothing and holds no AWS
  # credential. It is a separate job rather than a verify-script gate because Docker is not
  # available everywhere the script runs; the script's static policy gate checks the
  # Dockerfile's shape, and this job is the only place the image is actually built. It is to be
  # made a required status check on main (infra/terraform/runbooks/staging-delivery.md).
  container:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out into a directory named firmbatch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: firmbatch
          persist-credentials: false

      - name: Build the production image (no registry login, no push)
        working-directory: firmbatch
        run: docker build --pull --tag firmbatch-control-plane:ci .

      - name: The image runs as numeric 10001:10001, imports its entry points and holds no test, environment or evidence file
        run: |
          test "$(docker image inspect --format '{{.Config.User}}' firmbatch-control-plane:ci)" = "10001:10001"
          test "$(docker run --rm --network none --entrypoint id firmbatch-control-plane:ci -u)" = "10001"
          test "$(docker run --rm --network none --entrypoint id firmbatch-control-plane:ci -g)" = "10001"
          test "$(docker image inspect --format '{{json .Config.Cmd}}' firmbatch-control-plane:ci)" = '["python3","-m","firmbatch.control_plane.api","--host","0.0.0.0","--port","8080"]'
          docker run --rm --network none --entrypoint python3 firmbatch-control-plane:ci -m firmbatch.control_plane.api --host 0.0.0.0 --port 8080 --help
          docker run --rm --network none --entrypoint python3 firmbatch-control-plane:ci -c "import firmbatch.control_plane.api.app, firmbatch.control_plane.migrate"
          docker run --rm --network none --entrypoint sh firmbatch-control-plane:ci -c 'test ! -e /app/firmbatch/control_plane/tests && test ! -e /app/firmbatch/control_plane/testing && test ! -e /app/.env && test ! -e /app/firmbatch/.env && test ! -e /app/firmbatch/docs && test ! -e /app/firmbatch/infra && test ! -e /app/firmbatch/.github && test -f /app/firmbatch/portal/dist/index.html'
