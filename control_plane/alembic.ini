# Alembic configuration for the Firmbatch v1 control plane.
#
# There is deliberately NO sqlalchemy.url here. The URL comes from
# FIRMBATCH_MIGRATION_DATABASE_URL, read by db/migrations/env.py through
# control_plane/config.py -- a connection string committed to this file would be exactly
# the usable production default the configuration boundary forbids.
#
# Usable two ways, both reaching the same env.py:
#
#   cd "$(git rev-parse --show-toplevel)/.."
#   python3 -m firmbatch.control_plane.migrate upgrade        # what tests and CI use
#   alembic -c firmbatch/control_plane/alembic.ini upgrade head

[alembic]
# %(here)s is the directory containing this file, so the location does not depend on the
# working directory the command happened to be run from.
script_location = %(here)s/db/migrations
prepend_sys_path = .
path_separator = os
file_template = %%(rev)s_%%(slug)s
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
# WARNING, not INFO. SQLAlchemy at INFO echoes every statement; this package handles
# tenant identifiers and must not become a second place they are written down.
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
